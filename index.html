
<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<meta name="description" content="Ứng dụng quản lý tài chính cá nhân" />
<title>Ví Cá Nhân - Quản lý chi tiêu</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #f1f5f9; color: #0f172a;
    --teal: #0f766e; --teal-dark: #115e59; --red: #dc2626; --green: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { max-width: 560px; margin: 0 auto; padding-bottom: 90px; }

  header {
    background: linear-gradient(135deg, var(--teal), #14b8a6);
    color: #fff; padding: 20px 18px 16px; border-radius: 0 0 20px 20px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 1.15rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  header .gear { cursor: pointer; font-size: 1.2rem; opacity: .9; }
  .balance-card { margin-top: 14px; }
  .balance-card .label { font-size: .75rem; opacity: .8; }
  .balance-card .amount { font-size: 1.7rem; font-weight: 700; letter-spacing: -.5px; }
  .mini-stats { display: flex; gap: 12px; margin-top: 10px; font-size: .78rem; }
  .mini-stats div { flex: 1; background: rgba(255,255,255,.14); border-radius: 10px; padding: 8px 10px; }
  .mini-stats b { display: block; font-size: .95rem; margin-top: 2px; }

  main { padding: 14px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 14px; }

  /* Form thêm giao dịch */
  .seg { display: flex; background: #e2e8f0; border-radius: 10px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 8px; font-size: .85rem; font-weight: 600; color: #64748b; cursor: pointer; }
  .seg button.active { background: #fff; color: var(--red); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg[data-mode="income"] button.active { color: var(--green); }

  .amount-wrap { position: relative; margin-bottom: 10px; }
  .amount-wrap span { position: absolute; left: 12px; top: 12px; color: #94a3b8; font-weight: 600; }
  input[type=number], input[type=text], input[type=date], select {
    width: 100%; padding: 11px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: .95rem; background: #fff; color: inherit; outline: none;
  }
  input:focus, select:focus { border-color: var(--teal); }
  #amount { padding-left: 30px; font-size: 1.25rem; font-weight: 700; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  label { display: block; font-size: .72rem; color: #64748b; margin: 0 0 4px 2px; font-weight: 600; }
  .field { margin-bottom: 10px; }

  .btn-primary {
    width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--teal);
    color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  .btn-primary:active { background: var(--teal-dark); }
  .btn-primary:disabled { opacity: .6; }

  /* Danh sách giao dịch */
  .tx-list { list-style: none; }
  .tx-item { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid #f1f5f9; }
  .tx-item:last-child { border-bottom: 0; }
  .tx-icon { width: 38px; height: 38px; border-radius: 10px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-info .cat { font-weight: 600; font-size: .85rem; }
  .tx-info .meta { font-size: .7rem; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-amt { font-weight: 700; font-size: .88rem; }
  .tx-amt.expense { color: var(--red); }
  .tx-amt.income { color: var(--green); }
  .tx-del { border: 0; background: transparent; color: #cbd5e1; cursor: pointer; font-size: 1rem; padding: 4px; }
  .tx-del:hover { color: var(--red); }

  .empty { text-align: center; color: #94a3b8; font-size: .85rem; padding: 18px 0; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: .8rem; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* Nút thêm nhanh cố định */
  #fab {
    position: fixed; bottom: 18px; right: max(18px, calc(50% - 280px + 18px));
    width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--teal);
    color: #fff; font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 12px rgba(15,118,110,.4); z-index: 20;
  }

  /* Panel cấu hình */
  #configPanel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; align-items: flex-end; }
  #configPanel.open { display: flex; }
  #configPanel .sheet {
    background: #fff; width: 100%; border-radius: 18px 18px 0 0; padding: 18px;
    max-width: 560px; margin: 0 auto;
  }
  #configPanel h2 { font-size: 1rem; margin-bottom: 12px; }
  #configPanel .hint { font-size: .72rem; color: #94a3b8; margin-top: 4px; line-height: 1.4; }
  #configPanel .close { width: 100%; margin-top: 8px; padding: 10px; border: 0; background: #e2e8f0; border-radius: 10px; font-weight: 600; cursor: pointer; }

  .section-title { font-size: .8rem; font-weight: 700; color: #64748b; margin: 4px 2px 8px; text-transform: uppercase; letter-spacing: .3px; }
</style>
</head>
<body>

<header>
  <h1>💰 Ví Cá Nhân <span class="gear" id="gear" title="Cấu hình">⚙️</span></h1>
  <div class="balance-card">
    <div class="label">Tổng số dư tất cả tài khoản</div>
    <div class="amount" id="totalBalance">—</div>
    <div class="mini-stats">
      <div><span>Chi tháng này</span><b id="expenseMonth" style="color:#fecaca">—</b></div>
      <div><span>Số dư tiền mặt</span><b id="cashBalance">—</b></div>
    </div>
  </div>
</header>

<main>
  <!-- Form nhập nhanh -->
  <div class="card">
    <div class="seg" id="typeSeg" data-mode="expense">
      <button class="active" data-type="expense">💸 Chi tiêu</button>
      <button data-type="income">💵 Thu nhập</button>
    </div>
    <div class="field amount-wrap">
      <input type="number" id="amount" inputmode="decimal" placeholder="0" min="0" />
    </div>
    <div class="field">
      <label>Danh mục</label>
      <select id="category"></select>
    </div>
    <div class="row field">
      <div>
        <label>Tài khoản</label>
        <select id="account"></select>
      </div>
      <div>
        <label>Ngày</label>
        <input type="date" id="date" />
      </div>
    </div>
    <div class="field">
      <label>Ghi chú</label>
      <input type="text" id="note" placeholder="Không bắt buộc" />
    </div>
    <button class="btn-primary" id="saveBtn">＋ Lưu giao dịch</button>
  </div>

  <!-- Danh sách tháng này -->
  <div class="card">
    <div class="section-title">Giao dịch tháng này</div>
    <ul class="tx-list" id="txList"><li class="empty">Đang tải…</li></ul>
  </div>
</main>

<button id="fab" title="Thêm giao dịch">＋</button>

<div id="configPanel">
  <div class="sheet">
    <h2>⚙️ Cấu hình kết nối</h2>
    <div class="field">
      <label>URL Apps Script (kết thúc bằng /exec)</label>
      <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" />
    </div>
    <div class="field">
      <label>API Key (chạy generateApiKey() để lấy)</label>
      <input type="text" id="cfgKey" placeholder="Dán API key của bạn" />
      <div class="hint">Key chỉ lưu trên máy bạn (localStorage), không gửi đi đâu khác ngoài Apps Script của chính bạn.</div>
    </div>
    <button class="btn-primary" id="cfgSave">Lưu cấu hình</button>
    <button class="close" id="cfgClose">Đóng</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   VÍ CÁ NHÂN - frontend tĩnh, gọi Apps Script backend
   Không chứa API key trong code; key + URL lưu localStorage.
   ============================================================ */

const LS_URL = 'finance_api_url';
const LS_KEY = 'finance_api_key';

const EXPENSE_CATS = ['Ăn uống', 'Di chuyển', 'Mua sắm', 'Hóa đơn & tiện ích', 'Sức khỏe', 'Giáo dục', 'Giải trí', 'Góp mục tiêu', 'Khác'];
const INCOME_CATS  = ['Lương', 'Thưởng', 'Cho thuê nhà', 'Đầu tư', 'Khác'];
const CAT_ICONS = { 'Ăn uống':'🍜','Di chuyển':'🛵','Mua sắm':'🛍️','Hóa đơn & tiện ích':'🧾','Sức khỏe':'💊','Giáo dục':'📚','Giải trí':'🎮','Góp mục tiêu':'🎯','Lương':'💼','Thưởng':'🎁','Cho thuê nhà':'🏠','Đầu tư':'📈','Khác':'📝' };

let state = { accounts: [], transactions: [], mode: 'expense' };

// ---------- Lưu trữ cấu hình ----------
function getCfg() {
  return { url: localStorage.getItem(LS_URL) || '', key: localStorage.getItem(LS_KEY) || '' };
}
function saveCfg(url, key) {
  localStorage.setItem(LS_URL, url.trim());
  localStorage.setItem(LS_KEY, key.trim());
}

// ---------- Gọi API ----------
// POST dùng Content-Type text/plain để tránh preflight CORS; key nằm trong body JSON.
async function api(action, data) {
  const { url, key } = getCfg();
  if (!url || !key) throw new Error('CHUA_CAU_HINH');
  let res;
  if (action === 'list') {
    const month = new Date().toISOString().slice(0, 7);
    res = await fetch(url + '?action=list&month=' + month + '&key=' + encodeURIComponent(key), { method: 'GET' });
  } else {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: key, action: action, data: data || {} })
    });
  }
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'LOI');
  return json.result;
}

// ---------- Toast ----------
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Định dạng ----------
function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  return new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' ₫';
}
function fmtDate(s) {
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
}

// ---------- Render ----------
function renderAccountsSelects() {
  const accSel = document.getElementById('account');
  accSel.innerHTML = state.accounts
    .map(a => '<option value="' + esc(a.Id) + '">' + esc(a.Name) + '</option>').join('');
}

function renderCategories() {
  const catSel = document.getElementById('category');
  const cats = state.mode === 'expense' ? EXPENSE_CATS : INCOME_CATS;
  catSel.innerHTML = cats.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
}

function renderSummary() {
  const s = state.summary;
  if (!s) return;
  document.getElementById('totalBalance').textContent = fmt(s.totalBalance);
  document.getElementById('expenseMonth').textContent = fmt(s.expenseThisMonth);
  const cash = state.accounts.find(a => a.Type === 'cash');
  document.getElementById('cashBalance').textContent = cash ? fmt(s.perAccount[cash.Id]) : '—';
}

function renderTxList() {
  const ul = document.getElementById('txList');
  if (!state.transactions.length) {
    ul.innerHTML = '<li class="empty">Chưa có giao dịch nào trong tháng.</li>';
    return;
  }
  ul.innerHTML = state.transactions.map(t =>
    '<li class="tx-item">' +
      '<div class="tx-icon">' + (CAT_ICONS[t.Category] || '📝') + '</div>' +
      '<div class="tx-info">' +
        '<div class="cat">' + esc(t.Category) + '</div>' +
        '<div class="meta">' + fmtDate(t.Date) + ' · ' + esc(accountName(t.AccountId)) +
          (t.Note ? ' · ' + esc(t.Note) : '') + '</div>' +
      '</div>' +
      '<div class="tx-amt ' + (t.Type === 'expense' ? 'expense' : 'income') + '">' +
        (t.Type === 'expense' ? '−' : '+') + fmt(t.Amount) + '</div>' +
      '<button class="tx-del" data-id="' + esc(t.Id) + '" title="Xóa">✕</button>' +
    '</li>').join('');
  ul.querySelectorAll('.tx-del').forEach(btn => {
    btn.onclick = () => deleteTx(btn.dataset.id);
  });
}

function accountName(id) {
  const a = state.accounts.find(x => x.Id === id);
  return a ? a.Name : id;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ---------- Hành động ----------
async function load() {
  try {
    const r = await api('list');
    state.accounts = r.accounts || [];
    state.transactions = r.transactions || [];
    state.summary = r.summary;
    renderAccountsSelects();
    renderSummary();
    renderTxList();
  } catch (e) {
    document.getElementById('txList').innerHTML =
      '<li class="empty">' + (e.message === 'CHUA_CAU_HINH'
        ? 'Chưa cấu hình. Nhấn ⚙️ để nhập URL Apps Script và API key.'
        : 'Lỗi tải dữ liệu: ' + esc(e.message)) + '</li>';
  }
}

async function saveTx() {
  const amount = Number(document.getElementById('amount').value);
  if (!amount || amount <= 0) { toast('Nhập số tiền hợp lệ'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    await api('addTransaction', {
      date: document.getElementById('date').value,
      amount: amount,
      type: state.mode,
      category: document.getElementById('category').value,
      accountId: document.getElementById('account').value,
      note: document.getElementById('note').value.trim()
    });
    document.getElementById('amount').value = '';
    document.getElementById('note').value = '';
    toast('✅ Đã lưu vào Google Sheet');
    await load();
  } catch (e) {
    toast('❌ Lỗi: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function deleteTx(id) {
  if (!confirm('Xóa giao dịch này?')) return;
  try {
    await api('deleteTransaction', { id: id });
    toast('🗑️ Đã xóa');
    await load();
  } catch (e) {
    toast('❌ Lỗi: ' + e.message);
  }
}

// ---------- Sự kiện ----------
document.querySelectorAll('#typeSeg button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#typeSeg button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.mode = b.dataset.type;
    document.getElementById('typeSeg').dataset.mode = state.mode;
    renderCategories();
  };
});

document.getElementById('saveBtn').onclick = saveTx;
document.getElementById('amount').addEventListener('keydown', e => { if (e.key === 'Enter') saveTx(); });

document.getElementById('gear').onclick = openConfig;
document.getElementById('fab').onclick = () => {
  document.getElementById('amount').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

function openConfig() {
  const { url, key } = getCfg();
  document.getElementById('cfgUrl').value = url;
  document.getElementById('cfgKey').value = key;
  document.getElementById('configPanel').classList.add('open');
}
document.getElementById('cfgClose').onclick = () =>
  document.getElementById('configPanel').classList.remove('open');
document.getElementById('configPanel').onclick = e => {
  if (e.target.id === 'configPanel') e.target.classList.remove('open');
};
document.getElementById('cfgSave').onclick = () => {
  saveCfg(document.getElementById('cfgUrl').value, document.getElementById('cfgKey').value);
  document.getElementById('configPanel').classList.remove('open');
  toast('✅ Đã lưu cấu hình');
  load();
};

// ---------- Khởi động ----------
document.getElementById('date').value = new Date().toISOString().slice(0, 10);
renderCategories();
load();

// Đăng ký service worker để chạy PWA offline-shell
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>

</body>
